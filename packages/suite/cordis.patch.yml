# dsh-workbay-suite — bundle patch
#
# Aggregates the workbench bundles so a profile can mount the whole workbench
# with ONE entry in dsh.profile.bundles.
#
# Choose exactly one style per profile:
#
#   "bundles": ["...", "dsh-workbay-suite"]                 <- this patch wins
#   "bundles": ["...", "dsh-workbay-dock", "dsh-gitcraft", "dsh-downloader",
#               "dsh-workbay-files", "dsh-workbay-terminal"]   <- their own patches win
#
# Never list the suite AND any single bundle: both patches insert the same loader
# row, and a double mount registers the prefix route twice, which DSH rejects
# ("duplicate prefix route") and the whole plugin tree fails to start.
- insert:
    - id: workbay-dock
      name: 'dsh-workbay-dock'
    - id: workbay-files
      name: 'dsh-workbay-files'
      config:
        allowWrite: true
        maxFileBytes: 1048576
    - id: workbay-terminal
      name: 'dsh-workbay-terminal'
      config:
        shell: powershell
        pty: auto
        maxSessions: 8
    - id: gitcraft
      name: 'dsh-gitcraft'
      config:
        refreshIntervalMs: 15000
        timeoutMs: 30000
        networkTimeoutMs: 180000
        defaultDiffView: unified
    - id: downloader
      name: 'dsh-downloader'
